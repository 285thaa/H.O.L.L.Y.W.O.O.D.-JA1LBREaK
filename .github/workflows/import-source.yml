name: Import Hollywood Jailbreak source

on:
  push:
    paths:
      - hollywood-jailbreak-source.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand source package
        run: |
          test -f hollywood-jailbreak-source.zip
          unzip -o hollywood-jailbreak-source.zip -d .
      - name: Commit imported project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore cloudflare docs legacy media-server
          if git diff --cached --quiet; then
            echo "No source changes to import."
          else
            git commit -m "Import Hollywood Jailbreak source and media engine"
            git push
          fi
